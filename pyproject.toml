[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-scan-cli"
version = "1.4.11"
description = "Static MCP security scanner (CLI + MCP server): tool poisoning, prompt injection, and rug-pull detection in MCP manifests, plus an OWASP LLM Top 10 prompt-injection/jailbreak smoke test."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Ventrova" }]
keywords = ["mcp", "model-context-protocol", "mcp-security", "mcp-scanner", "tool-poisoning", "rug-pull", "supply-chain-security", "llm", "security", "prompt-injection", "jailbreak", "ai-security", "red-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
mcp-server = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/Ventrova/sentinel-scan-cli"
"Managed audit" = "https://ventrova.dev/audit"

[project.scripts]
sentinel-scan = "sentinel_scan:main"
sentinel-scan-mcp-server = "sentinel_scan_mcp_server:main"

[tool.setuptools]
py-modules = ["sentinel_scan", "sentinel_scan_mcp_server"]
