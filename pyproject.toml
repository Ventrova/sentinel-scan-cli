[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-scan-cli"
version = "1.4.16"
description = "MCP security scanner: scan MCP servers and tool manifests for tool poisoning, prompt injection, and rug-pulls - 10 OWASP-mapped heuristics, CLI + MCP server, fully offline. Also runs an OWASP LLM Top 10 prompt-injection/jailbreak smoke test against your own LLM endpoint."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Ventrova" }]
keywords = ["mcp", "mcp-server", "mcp-client", "model-context-protocol", "mcp-security", "mcp-scanner", "manifest-scanner", "security-scanner", "tool-poisoning", "rug-pull", "supply-chain-security", "llm", "security", "prompt-injection", "jailbreak", "ai-security", "red-team", "owasp", "sarif", "llm-security", "devsecops", "vulnerability-scanner", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
mcp-server = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/Ventrova/sentinel-scan-cli"
"Managed audit" = "https://ventrova.dev/audit"

[project.scripts]
sentinel-scan = "sentinel_scan:main"
sentinel-scan-mcp-server = "sentinel_scan_mcp_server:main"

[tool.setuptools]
py-modules = ["sentinel_scan", "sentinel_scan_mcp_server"]
