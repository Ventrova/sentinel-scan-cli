[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-scan-cli"
version = "1.1.0"
description = "Free, zero-dependency 15-attack prompt-injection / jailbreak smoke test for your own LLM endpoint."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Ventrova" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "ai-security", "red-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Ventrova/sentinel-scan-cli"
"Managed audit" = "https://ventrova.dev/audit"

[project.scripts]
sentinel-scan = "sentinel_scan:main"

[tool.setuptools]
py-modules = ["sentinel_scan"]
