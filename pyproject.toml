[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-scan-cli"
version = "1.4.9"
description = "Free, zero-dependency 15-attack prompt-injection / jailbreak smoke test for your own LLM endpoint."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Ventrova" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "ai-security", "red-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
mcp-server = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/Ventrova/sentinel-scan-cli"
"Managed audit" = "https://ventrova.dev/audit"

[project.scripts]
sentinel-scan = "sentinel_scan:main"
sentinel-scan-mcp-server = "sentinel_scan_mcp_server:main"

[tool.setuptools]
py-modules = ["sentinel_scan", "sentinel_scan_mcp_server"]
