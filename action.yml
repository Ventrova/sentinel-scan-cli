name: 'Sentinel Scan (MCP/LLM security)'
description: "Scan MCP manifests for prompt-injection, excessive-agency & OWASP LLM Top 10 risks; fail your build on a severity gate."
author: 'Ventrova'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  manifest:
    description: 'Path to the MCP tool manifest (mcp.json) to scan, relative to the repo root.'
    required: true
    default: 'mcp.json'
  fail-on-severity:
    description: "Fail the step if any finding is at or above this severity: high, medium, low, or none to never fail."
    required: false
    default: 'high'
  format:
    description: "Report format to write: sarif, markdown, or json."
    required: false
    default: 'sarif'
  output:
    description: 'Path to write the converted report to.'
    required: false
    default: 'sentinel-scan-results.sarif'
  upload-sarif:
    description: "Whether to automatically upload the SARIF report to the GitHub code-scanning/Security tab via github/codeql-action/upload-sarif. Only applies when format is 'sarif'. Requires the calling job to have 'security-events: write' permission."
    required: false
    default: 'true'

outputs:
  results-file:
    description: 'Path to the generated report file.'
    value: ${{ steps.scan_sarif.outputs.results-file || steps.convert.outputs.results-file }}
  finding-count:
    description: 'Total number of findings.'
    value: ${{ steps.gate_sarif.outputs.finding-count || steps.convert.outputs.finding-count }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install sentinel-scan-cli
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run sentinel-scan mcp (SARIF)
      id: scan_sarif
      if: inputs.format == 'sarif'
      shell: bash
      run: |
        sentinel-scan mcp --manifest "${{ inputs.manifest }}" --format sarif --output "${{ inputs.output }}"
        echo "results-file=${{ inputs.output }}" >> "$GITHUB_OUTPUT"

    - name: Apply severity gate (SARIF)
      id: gate_sarif
      if: inputs.format == 'sarif'
      shell: bash
      run: |
        count=$(jq '[.runs[0].results[]] | length' "${{ inputs.output }}")
        echo "finding-count=$count" >> "$GITHUB_OUTPUT"

        threshold="${{ inputs.fail-on-severity }}"
        if [ "$threshold" = "none" ]; then
          exit 0
        fi

        case "$threshold" in
          high) levels='["error"]' ;;
          medium) levels='["error","warning"]' ;;
          low) levels='["error","warning","note"]' ;;
          *) echo "::error::unknown fail-on-severity '$threshold'"; exit 1 ;;
        esac

        breach=$(jq --argjson levels "$levels" \
          '[.runs[0].results[] | select(.level as $l | $levels | index($l))] | length' \
          "${{ inputs.output }}")
        if [ "$breach" -gt 0 ]; then
          echo "::error::sentinel-scan found $breach finding(s) at or above severity '$threshold'"
          exit 1
        fi

    - name: Run sentinel-scan mcp (JSON)
      id: scan_json
      if: inputs.format != 'sarif'
      shell: bash
      run: |
        sentinel-scan mcp --manifest "${{ inputs.manifest }}" --format json --output "${{ runner.temp }}/sentinel-scan-raw.json"
        echo "raw-file=${{ runner.temp }}/sentinel-scan-raw.json" >> "$GITHUB_OUTPUT"

    - name: Convert results and apply severity gate (Markdown/JSON)
      id: convert
      if: inputs.format != 'sarif'
      shell: bash
      run: |
        python "${{ github.action_path }}/scripts/action/convert_results.py" \
          --input "${{ runner.temp }}/sentinel-scan-raw.json" \
          --manifest "${{ inputs.manifest }}" \
          --format "${{ inputs.format }}" \
          --output "${{ inputs.output }}" \
          --fail-on-severity "${{ inputs.fail-on-severity }}"
        exit_code=$?
        echo "results-file=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
        count=$(python -c "import json; print(json.load(open('${{ runner.temp }}/sentinel-scan-raw.json'))['summary']['num_findings'])")
        echo "finding-count=$count" >> "$GITHUB_OUTPUT"
        exit $exit_code

    - name: Upload SARIF to code scanning
      if: always() && inputs.format == 'sarif' && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: sentinel-scan-mcp
