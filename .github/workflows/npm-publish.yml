name: Publish to npm

# Tokenless publishing via npm Trusted Publishing (OIDC) - no NPM_TOKEN anywhere.
# The GitHub Actions OIDC identity (id-token: write) authenticates straight to the
# npm registry once a Trusted Publisher is configured for the package.
#
# ONE-TIME SETUP (see NPM_PUBLISH.md):
#   1. Bootstrap the package onto npm ONCE - Trusted Publishing cannot create a
#      brand-new package name. Either `npm publish` from a trusted machine (npm
#      prompts for your 2FA OTP; no token is stored anywhere), or use a throwaway
#      Automation token you delete right after.
#   2. On npmjs.com: sentinel-scan-cli -> Settings -> Trusted Publisher -> add
#      GitHub repo "Ventrova/sentinel-scan-cli", workflow "npm-publish.yml",
#      environment "npm".
# After that, pushing a `vX.Y.Z` tag publishes with zero credentials.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/sentinel-scan-cli
    permissions:
      id-token: write # required: lets npm mint the OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      # NB: intentionally NO registry-url here. setup-node's registry-url writes an
      # .npmrc that forces token auth (always-auth + NODE_AUTH_TOKEN), which fights
      # the tokenless OIDC flow. The default registry (npmjs.org) is used anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade npm (Trusted Publishing OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install dependencies (needed by prepublishOnly test run)
        # npm ci on ephemeral GH-hosted runners has occasionally left
        # @modelcontextprotocol/sdk's subpath exports unresolved on the first
        # attempt (transient extraction/cache flake, not reproducible with a
        # clean local install) - retry a clean install rather than fail the
        # publish on infra flakiness.
        run: |
          for i in 1 2 3; do
            npm ci && node -e "require.resolve('@modelcontextprotocol/sdk/server/mcp.js')" && break
            echo "::warning::npm ci attempt $i did not produce a resolvable @modelcontextprotocol/sdk install, retrying..."
            rm -rf node_modules
            sleep 5
          done
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - name: Publish to npm (OIDC, tokenless)
        run: |
          set +e
          OUT="$(npm publish --provenance --access public 2>&1)"; CODE=$?
          printf '%s\n' "$OUT"
          if [ $CODE -ne 0 ]; then
            # npm's staged-publishing flow can return 409 after the version is already
            # published (provenance signed, version live). Treat "already there" as success
            # so the release is idempotent instead of a false-red.
            if printf '%s' "$OUT" | grep -qiE 'previously staged version|cannot publish over|EPUBLISHCONFLICT|code E409|already exists'; then
              echo "::notice::sentinel-scan-cli@${GITHUB_REF_NAME#v} already published/staged on npm - treating as success."
              exit 0
            fi
            exit $CODE
          fi
