name: Publish to MCP Registry

# Tokenless publishing via GitHub Actions OIDC - the registry verifies this
# workflow runs on Ventrova/sentinel-scan-cli and grants the io.github.Ventrova
# namespace on that basis, so no MCP_GITHUB_TOKEN or other secret is needed.
# See: https://github.com/modelcontextprotocol/registry docs/modelcontextprotocol-io/github-actions.mdx
#
# Assumes the npm package (sentinel-scan-cli) is already published for this
# version by npm-publish.yml; this workflow only publishes the server.json
# metadata to registry.modelcontextprotocol.io, it does not touch npm.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC auth to the MCP Registry
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches server.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRV="$(node -p "require('./server.json').version")"
          if [ "$TAG" != "$SRV" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match server.json version $SRV"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish server to MCP Registry
        run: |
          set +e
          OUT="$(./mcp-publisher publish 2>&1)"; CODE=$?
          printf '%s\n' "$OUT"
          if [ $CODE -ne 0 ]; then
            if printf '%s' "$OUT" | grep -qiE 'already exists|already published'; then
              echo "::notice::server.json version already published to MCP Registry - treating as success."
              exit 0
            fi
            exit $CODE
          fi
