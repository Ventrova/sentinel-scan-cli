name: Bug report
description: Something in sentinel-scan-cli isn't working as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give, the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error output.
      placeholder: Tell us what you saw
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command(s) you ran, target model/endpoint, and any relevant config.
      placeholder: |
        1. sentinel_scan.py --target ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sentinel-scan-cli version / commit
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and how you installed the CLI.
    validations:
      required: false
  - type: checkboxes
    id: contact
    attributes:
      label: May we follow up?
      options:
        - label: I'm open to Ventrova following up about this issue.
          required: false
