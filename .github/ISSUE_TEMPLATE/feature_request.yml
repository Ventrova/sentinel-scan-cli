name: Feature request
description: Suggest an idea, attack pattern, or integration for sentinel-scan-cli.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that the CLI doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: interest
    attributes:
      label: Interested in more than the open-source CLI?
      options:
        - label: I'd like to hear about Ventrova's hosted/managed LLM security scanning.
          required: false
